[versions]
flyway = "13.11.1"
ktor = "3.6.0"
sykepengerGradlePlugins = "20261026.1611"
tbd-libs = "20261013.1613"
testcontainers = "2.0.5"

[libraries]
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.1.0"
jackson3-bom = "tools.jackson:jackson-bom:3.2.4"
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-slf4j = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.11.0"
logback-classic = "ch.qos.logback:logback-classic:1.6.5"
logstash-logback-encoder = "net.logstash.logback:logstash-logback-encoder:9.0"
mock-oauth2-server = "no.nav.security:mock-oauth2-server:6.1.2"
postgresql = "org.postgresql:postgresql:42.7.14"
slf4jApi = "org.slf4j:slf4j-api:2.0.20"
tbd-libs-naisful-postgres = { module = "com.github.navikt.tbd-libs:naisful-postgres", version.ref = "tbd-libs" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[bundles]

[plugins]
sykepenger-kotlin = { id = "no.nav.sykepenger.kotlin", version.ref = "sykepengerGradlePlugins" }
sykepenger-root = { id = "no.nav.sykepenger.root", version.ref = "sykepengerGradlePlugins" }
