[versions]
flyway = "13.12.2"
ktor = "3.6.1"
sykepengerGradlePlugins = "20261029.1945"
tbd-libs = "20261123.1112"
testcontainers = "2.0.5"

[libraries]
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.1.0"
jackson3-bom = "tools.jackson:jackson-bom:3.3.0"
kafka-clients = "org.apache.kafka:kafka-clients:4.4.0"
ktor-openapi-schema-reflect = { module = "io.ktor:ktor-openapi-schema-reflect", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-routing-openapi = { module = "io.ktor:ktor-server-routing-openapi", version.ref = "ktor" }
ktor-server-swagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-coroutines-slf4j = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.11.0"
logback-classic = "ch.qos.logback:logback-classic:1.6.7"
logstash-logback-encoder = "net.logstash.logback:logstash-logback-encoder:9.0"
mock-oauth2-server = "no.nav.security:mock-oauth2-server:7.0.1"
postgresql = "org.postgresql:postgresql:42.7.14"
slf4jApi = "org.slf4j:slf4j-api:2.0.20"
sykepenger-libs-leader-election = "no.nav.sykepenger.libs:leader-election:20261120.1340"
sykepenger-libs-logging = "no.nav.sykepenger.libs:logging:20261120.1340"
sykepenger-libs-postgres = "no.nav.sykepenger.libs:postgres:20261120.1340"
sykepenger-libs-testing = "no.nav.sykepenger.libs:testing:20261120.1340"
tbd-libs-rapids-and-rivers-api = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-api", version.ref = "tbd-libs" }
tbd-libs-rapids-and-rivers-test = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbd-libs" }
tbd-libs-naisful-postgres = { module = "com.github.navikt.tbd-libs:naisful-postgres", version.ref = "tbd-libs" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[bundles]

[plugins]
sykepenger-kotlin = { id = "no.nav.sykepenger.kotlin", version.ref = "sykepengerGradlePlugins" }
sykepenger-root = { id = "no.nav.sykepenger.root", version.ref = "sykepengerGradlePlugins" }
